<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citadel of Truth — Command Centre</title>
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/admin">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070d1a;
      color: #f0f4ff;
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .icon {
      width: 72px; height: 72px;
      background: rgba(79,142,247,0.12);
      border: 1px solid rgba(79,142,247,0.3);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2s ease infinite;
    }
    .icon svg { width: 36px; height: 36px; fill: #4f8ef7; }
    h1 { font-size: 2rem; font-weight: 800; }
    p { color: #64748b; font-size: 0.95rem; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #4f8ef7, #2563eb);
      color: #fff; text-decoration: none;
      padding: 13px 32px; border-radius: 12px;
      font-weight: 700; font-size: 0.95rem;
      margin-top: 8px;
      transition: opacity .2s;
    }
    a:hover { opacity: 0.85; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79,142,247,0.3); }
      50% { box-shadow: 0 0 0 14px rgba(79,142,247,0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"/></svg>
    </div>
    <h1>Command Centre</h1>
    <p>Redirecting you to the new Citadel CMS…</p>
    <a href="http://localhost:3000/admin">Open Command Centre →</a>
  </div>
</body>
</html>
