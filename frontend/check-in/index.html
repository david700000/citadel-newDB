<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Selfie Frame | Photo Experience</title>
  
  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ─── DESIGN TOKENS ─── */
    :root {
      --color-bg: #0a0a0f;
      --color-surface: #12121a;
      --color-surface-2: #1a1a26;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-text: #f0f0fa;
      --color-text-muted: rgba(240, 240, 250, 0.55);
      --color-accent-1: #7c3aed;
      --color-accent-2: #c026d3;
      --color-accent-grad: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
      --color-primary-grad: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --radius-xl: 1.75rem;
      --shadow-glow: 0 0 40px rgba(124, 58, 237, 0.25);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Outfit", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    .app-main {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(192, 38, 211, 0.1) 0%, transparent 60%),
        var(--color-bg);
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.25rem 1rem 1rem;
      gap: 0.75rem;
      overflow: hidden;
    }

    .scene-header {
      text-align: center;
      flex-shrink: 0;
    }

    .scene-title {
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 700;
      background: var(--color-accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.01em;
    }

    .scene-subtitle {
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      color: var(--color-text-muted);
      margin-top: 0.2rem;
    }

    .viewport {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .camera-wrapper, .result-wrapper {
      position: relative;
      width: 100%;
      max-width: min(100%, calc((100vh - 200px) * 4 / 3));
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px var(--color-border), var(--shadow-glow), 0 24px 64px rgba(0, 0, 0, 0.6);
    }

    .camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* mirror */
    }

    .frame-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 5;
    }

    .capture-btn-container {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .capture-btn {
      position: relative;
      width: 72px;
      height: 72px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition);
    }

    .capture-btn:active {
      transform: scale(0.92);
    }

    .capture-btn-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    }

    .capture-btn-core {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #fff;
    }

    .result-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .action-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-shrink: 0;
      padding: 0.25rem 0;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: transform var(--transition), box-shadow var(--transition);
      color: #fff;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-icon {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--color-primary-grad);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-secondary {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      color: var(--color-text);
    }

    .btn-accent {
      background: var(--color-accent-grad);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
    }

    .loading-screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      text-align: center;
    }

    .loading-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(124, 58, 237, 0.15);
      border-top-color: var(--color-accent-1);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="app-main">
    
    <!-- LOADING SCENE -->
    <div id="scene-loading" class="loading-screen">
      <div class="loading-content">
        <div class="loading-ring"></div>
        <p style="color: var(--color-text-muted)">Preparing photo experience...</p>
      </div>
    </div>

    <!-- ERROR SCENE -->
    <div id="scene-error" class="loading-screen hidden">
      <div class="loading-content">
        <p id="error-message" style="color: #ef4444; font-weight: 500;"></p>
        <button class="btn btn-secondary" onclick="window.location.reload()" style="margin-top: 1rem;">Try Again</button>
      </div>
    </div>

    <!-- CAMERA SCENE -->
    <div id="scene-camera" class="scene hidden">
      <div class="scene-header">
        <h1 class="scene-title">Take Your Photo</h1>
        <p class="scene-subtitle">Position yourself and tap capture</p>
      </div>
      <div class="viewport">
        <div class="camera-wrapper">
          <video id="camera-feed" autoplay playsinline class="camera-feed"></video>
          <img id="camera-frame-overlay" class="frame-overlay" alt="Frame" />
          <div class="capture-btn-container">
            <button id="capture-btn" class="capture-btn" aria-label="Take selfie">
              <span class="capture-btn-ring"></span>
              <span class="capture-btn-core"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- RESULT SCENE -->
    <div id="scene-result" class="scene hidden">
      <div class="scene-header">
        <h1 class="scene-title">Your Photo is Ready!</h1>
        <p class="scene-subtitle">Download or share it with the world</p>
      </div>
      <div class="viewport">
        <div class="result-wrapper">
          <img id="result-img" class="result-image" alt="Composited result" />
        </div>
      </div>
      <div class="action-buttons">
        <button id="retake-btn" class="btn btn-secondary">Retake</button>
        <button id="download-btn" class="btn btn-primary">Download</button>
        <button id="share-btn" class="btn btn-accent hidden">Share</button>
      </div>
    </div>

  </main>

  <script>
    // Configuration
    const API_BASE = window.location.hostname.includes('netlify.app') 
      ? 'https://citadel-newdb.onrender.com' 
      : (window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1') ? 'http://localhost:3000' : '');

    let frameImage = null;
    let stream = null;

    // Elements
    const sceneLoading = document.getElementById('scene-loading');
    const sceneError = document.getElementById('scene-error');
    const sceneCamera = document.getElementById('scene-camera');
    const sceneResult = document.getElementById('scene-result');
    
    const video = document.getElementById('camera-feed');
    const cameraOverlay = document.getElementById('camera-frame-overlay');
    const resultImg = document.getElementById('result-img');
    const errorMessage = document.getElementById('error-message');

    // Init
    async function init() {
      try {
        // Step 1: Load Settings to get frame url
        const res = await fetch(`${API_BASE}/api/settings`);
        if (!res.ok) throw new Error("Could not load frame overlay settings");
        const settings = await res.json();
        
        const frameUrl = settings.selfie_frame_url;
        if (!frameUrl) throw new Error("No frame configured. Please upload a frame in the CMS.");

        // Step 2: Preload frame image
        frameImage = new Image();
        frameImage.crossOrigin = "anonymous";
        frameImage.onload = startCamera;
        frameImage.onerror = () => showError("Failed to preload frame image");
        frameImage.src = frameUrl;
        cameraOverlay.src = frameUrl;

      } catch (err) {
        showError(err.message);
      }
    }

    // Camera Access
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            aspectRatio: 4 / 3,
            width: { ideal: 1440 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        
        sceneLoading.classList.add('hidden');
        sceneCamera.classList.remove('hidden');
      } catch (err) {
        showError("Could not access front camera. Please check permissions.");
      }
    }

    // Capture & Composite
    document.getElementById('capture-btn').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1440;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      // Draw mirrored video
      ctx.translate(1440, 0);
      ctx.scale(-1, 1);
      
      // Calculate cover math for video aspect fill
      const videoRatio = video.videoWidth / video.videoHeight;
      const targetRatio = 1440 / 1080;
      let sx, sy, sw, sh;
      if (videoRatio > targetRatio) {
        sh = video.videoHeight;
        sw = video.videoHeight * targetRatio;
        sx = (video.videoWidth - sw) / 2;
        sy = 0;
      } else {
        sw = video.videoWidth;
        sh = video.videoWidth / targetRatio;
        sx = 0;
        sy = (video.videoHeight - sh) / 2;
      }
      
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 1440, 1080);
      
      // Reset transform & Draw frame overlay on top
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(frameImage, 0, 0, 1440, 1080);

      // Render composite to page
      const compositeDataUrl = canvas.toDataURL('image/png', 1.0);
      resultImg.src = compositeDataUrl;

      // Stop camera track
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      // Show result scene
      sceneCamera.classList.add('hidden');
      sceneResult.classList.remove('hidden');
      setupShare(compositeDataUrl);
    });

    // Retake
    document.getElementById('retake-btn').addEventListener('click', () => {
      sceneResult.classList.add('hidden');
      sceneLoading.classList.remove('hidden');
      startCamera();
    });

    // Download
    document.getElementById('download-btn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = resultImg.src;
      a.download = `selfie-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // Setup native sharing if available
    function setupShare(dataUrl) {
      const shareBtn = document.getElementById('share-btn');
      if (navigator.share && navigator.canShare) {
        shareBtn.classList.remove('hidden');
        shareBtn.onclick = async () => {
          try {
            const blob = await (await fetch(dataUrl)).blob();
            const file = new File([blob], `selfie-${Date.now()}.png`, { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: "My Photo",
                text: "Check out my photo! 📸"
              });
            }
          } catch (err) {
            console.error("Sharing failed:", err);
          }
        };
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      sceneLoading.classList.add('hidden');
      sceneCamera.classList.add('hidden');
      sceneResult.classList.add('hidden');
      sceneError.classList.remove('hidden');
    }

    // Start
    init();
  </script>
</body>
</html>
