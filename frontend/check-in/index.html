<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Photo Experience | Citadel of Truth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #e8a923; --gold-2: #f5c842;
      --navy: #0c1428; --navy-2: #14203a; --navy-3: #1d2d4e;
      --ink: #0c0c14; --white: #ffffff; --off-white: #f0eee8;
      --text-muted: rgba(240,238,232,0.55);
      --border: rgba(232,169,35,0.15);
      --glow-gold: 0 0 40px rgba(232,169,35,0.28);
      --r-xl: 1.75rem; --r-pill: 999px;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; height:-webkit-fill-available; }
        body {
      min-height:100vh; min-height:-webkit-fill-available;
      overflow:hidden; background:#000000; color:var(--off-white);
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; touch-action:manipulation; overscroll-behavior:none;
    }
    .bg { display:none; }
    .bg-cross { display:none; }
    .bg-cross svg { width:min(320px,58vw); }
    .app { position:relative; z-index:1; width:100vw; height:100vh; height:-webkit-fill-available; display:flex; flex-direction:column; align-items:center; }
    .topbar { width:100%; display:flex; align-items:center; justify-content:center; gap:.5rem;
      padding:max(env(safe-area-inset-top,.5rem),.5rem) 1rem .5rem; flex-shrink:0; }
    .brand-dot { display:none; }
    .brand-name { display:none; }
    .hidden { display:none !important; }
    .splash { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex:1; }
    .splash-inner { display:flex; flex-direction:column; align-items:center; gap:1.25rem; text-align:center; padding:1rem; }
    .spin-ring { width:50px; height:50px; border-radius:50%; border:3px solid rgba(232,169,35,.15); border-top-color:var(--gold); animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .splash-text { font-size:.92rem; font-weight:500; color:var(--text-muted); }
    .error-icon { font-size:2.4rem; }
    .error-msg { font-size:.92rem; font-weight:600; color:#f87171; line-height:1.5; max-width:280px; text-align:center; }
    .scene { width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
      padding:.5rem 1rem calc(max(env(safe-area-inset-bottom,.75rem),.75rem) + .5rem); gap:.6rem; overflow:hidden; }
    .scene-head { text-align:center; flex-shrink:0; }
    .scene-title { font-size:clamp(1.1rem,5vw,1.55rem); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:var(--off-white); }
    .scene-title span { background:linear-gradient(90deg,var(--gold),var(--gold-2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .scene-sub { margin-top:.22rem; font-size:clamp(.75rem,3vw,.88rem); font-weight:500; color:var(--text-muted); }
    .viewport { flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .frame-box {
      position:relative;
      /* Contain-fit: fills the viewport without distortion */
      width:calc(100% - 1.5rem);
      height:auto;
      max-height:100%;
      aspect-ratio:4/3;
      border-radius:var(--r-xl); overflow:hidden; background:#000;
      box-shadow:0 0 0 1px var(--border), 0 28px 70px rgba(0,0,0,.65); }
    .frame-box::before,.frame-box::after { display:none; }
    .camera-feed { width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1); }
    .frame-overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; z-index:5; }
    .result-img { width:100%; height:100%; object-fit:cover; display:block; }
    .shutter-wrap { position:absolute; bottom:1rem; left:50%; transform:translateX(-50%); z-index:10; display:flex; flex-direction:column; align-items:center; gap:.35rem; }
    .shutter { width:68px; height:68px; border-radius:50%; background:none; border:none; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; transition:transform .18s var(--ease); }
    .shutter:active { transform:scale(.88); }
    .shutter-ring { position:absolute; inset:0; border-radius:50%; border:3px solid rgba(255,255,255,.9); box-shadow:0 0 0 2px rgba(255,255,255,.18), 0 0 30px rgba(255,255,255,.3); }
    .shutter-core { width:50px; height:50px; border-radius:50%; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.3); }
    .shutter-label { display:none; }
    .actions { display:flex; gap:.55rem; justify-content:center; align-items:center; flex-shrink:0; width:100%; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; height:50px; padding:0 1.35rem;
      border-radius:var(--r-pill); font-family:inherit; font-size:.88rem; font-weight:700; letter-spacing:.005em;
      border:none; cursor:pointer; white-space:nowrap; transition:transform .18s var(--ease),opacity .15s;
      -webkit-tap-highlight-color:transparent; min-width:90px; }
    .btn:active { transform:scale(.93); opacity:.88; }
    .btn svg { flex-shrink:0; }
    .btn-download { background:#ffffff; color:#000000; box-shadow:0 4px 20px rgba(255,255,255,.15),0 1px 0 rgba(255,255,255,.2) inset; flex:1 1 auto; max-width:210px; }
    .btn-share { background:rgba(255,255,255,.08); color:#ffffff; border:1.5px solid rgba(255,255,255,.4); flex:1 1 auto; max-width:160px; }
    .btn-retake { background:rgba(255,255,255,.06); color:var(--off-white); border:1.5px solid rgba(255,255,255,.15); flex:0 0 auto; }
    .btn-retry { background:rgba(248,113,113,.1); color:#fca5a5; border:1.5px solid rgba(248,113,113,.28); flex:0 0 auto; }
    @keyframes flashIn {
      0%{opacity:0;transform:scale(.95)}
      60%{opacity:1;transform:scale(1.012)}
      100%{opacity:1;transform:scale(1)}
    }
    .anim-flash { animation:flashIn .4s var(--ease) both; }
    @media (max-height:600px) {
      .shutter { width:58px; height:58px; } .shutter-core { width:42px; height:42px; }
      .scene { gap:.35rem; } .scene-title { font-size:1rem; }
      .btn { height:44px; font-size:.83rem; }
    }
    @media (min-width:540px) {
      .btn { height:54px; font-size:.95rem; } .shutter { width:76px; height:76px; } .shutter-core { width:56px; height:56px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-cross" aria-hidden="true">
    <svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="80" y="0" width="40" height="300" rx="8" fill="white"/>
      <rect x="0" y="80" width="200" height="40" rx="8" fill="white"/>
    </svg>
  </div>
  <div class="app">
    <header class="topbar">
      <div class="brand-dot"></div>
      <span class="brand-name">Citadel of Truth &amp; Mercy</span>
      <div class="brand-dot"></div>
    </header>
    <!-- LOADING -->
    <div id="scene-loading" class="splash">
      <div class="splash-inner">
        <div class="spin-ring"></div>
        <p class="splash-text">Preparing your photo experience&hellip;</p>
      </div>
    </div>
    <!-- ERROR -->
    <div id="scene-error" class="splash hidden">
      <div class="splash-inner">
        <div class="error-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <p id="error-message" class="error-msg"></p>
        <button class="btn btn-retry" onclick="window.location.reload()" style="margin-top:.5rem">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Try Again
        </button>
      </div>
    </div>
    <!-- CAMERA -->
    <div id="scene-camera" class="scene hidden">
      <div class="scene-head" style="display:none"></div>
      <div class="viewport">
        <div id="camera-box" class="frame-box">
          <video id="camera-feed" autoplay playsinline muted class="camera-feed"></video>
          <img id="camera-frame-overlay" class="frame-overlay" alt="">
          <div class="shutter-wrap">
            <button id="capture-btn" class="shutter" aria-label="Take photo">
              <span class="shutter-ring"></span>
              <span class="shutter-core"></span>
            </button>
            <span class="shutter-label">Tap to capture</span>
          </div>
        </div>
      </div>
    </div>
    <!-- RESULT -->
    <div id="scene-result" class="scene hidden">
      <div class="scene-head" style="display:none"></div>
      <div class="viewport">
        <div id="result-box" class="frame-box">
          <img id="result-img" class="result-img" alt="Your photo with church frame">
        </div>
      </div>
      <div class="actions">
        <button id="download-btn" class="btn btn-download">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Save Photo
        </button>
        <button id="share-btn" class="btn btn-share hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
          Share
        </button>
        <button id="retake-btn" class="btn btn-retake">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Retake
        </button>
      </div>
    </div>
  </div>
  <script>
    const API_BASE = (() => {
      const h = window.location.hostname;
      if (h.includes('netlify.app')) return 'https://citadel-newdb.onrender.com';
      if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
      return '';
    })();
    let frameImage = null, stream = null, frameW = 1440, frameH = 1080;
    const $ = id => document.getElementById(id);
    const sceneLoading = $('scene-loading'), sceneError = $('scene-error');
    const sceneCamera = $('scene-camera'), sceneResult = $('scene-result');
    const video = $('camera-feed'), camOverlay = $('camera-frame-overlay');
    const resultImg = $('result-img'), errMsg = $('error-message');
    const cameraBox = $('camera-box'), resultBox = $('result-box');
    function showScene(el) {
      [sceneLoading,sceneError,sceneCamera,sceneResult].forEach(s => s.classList.toggle('hidden', s !== el));
    }
    function showError(msg) { errMsg.textContent = msg; showScene(sceneError); }
    function setBoxRatio(r) {
      [cameraBox,resultBox].forEach(b => {
        b.style.aspectRatio = String(r);
      });
    }
    async function init() {
      try {
        // Try to load frame from settings — graceful fallback if none configured
        let frameUrl = null;
        try {
          const res = await fetch(API_BASE + '/settings');
          if (res.ok) {
            const s = await res.json();
            frameUrl = s.selfie_frame_url || null;
          }
        } catch (_) { /* network error — continue without frame */ }

        if (frameUrl) {
          // Preload the frame image then start camera
          frameImage = new Image();
          frameImage.crossOrigin = 'anonymous';
          frameImage.onload = () => {
            frameW = frameImage.naturalWidth  || 1440;
            frameH = frameImage.naturalHeight || 1080;
            setBoxRatio(frameW / frameH);
            camOverlay.src = frameUrl;
            startCamera();
          };
          frameImage.onerror = () => {
            // Frame failed to load — continue without it
            frameImage = null;
            startCamera();
          };
          frameImage.src = frameUrl;
        } else {
          // No frame configured — show camera as-is
          startCamera();
        }
      } catch(err) { showError(err.message); }
    }
    async function startCamera() {
      try {
        // Try requesting ideal 1080p stream
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            },
            audio: false
          });
        } catch (constraintsErr) {
          // Fallback to basic user camera request if ideal dimensions are rejected
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
        }
        video.srcObject = stream;
        try { await video.play(); } catch(_) {}
        showScene(sceneCamera);
      } catch(err) {
        showError('Camera access denied. Please allow camera permission and try again.');
      }
    }
    $('capture-btn').addEventListener('click', () => {
      cameraBox.style.outline = '3px solid rgba(255,255,255,.8)';
      setTimeout(() => { cameraBox.style.outline = ''; }, 280);
      const canvas = document.createElement('canvas');
      canvas.width = frameW; canvas.height = frameH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.translate(frameW, 0); ctx.scale(-1, 1);
      const vr = video.videoWidth / video.videoHeight, tr = frameW / frameH;
      let sx, sy, sw, sh;
      if (vr > tr) { sh = video.videoHeight; sw = sh*tr; sx = (video.videoWidth-sw)/2; sy = 0; }
      else          { sw = video.videoWidth;  sh = sw/tr; sx = 0; sy = (video.videoHeight-sh)/2; }
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, frameW, frameH);
      ctx.setTransform(1,0,0,1,0,0);
      // Only draw frame overlay if one was configured and loaded
      if (frameImage) ctx.drawImage(frameImage, 0, 0, frameW, frameH);
      const dataUrl = canvas.toDataURL('image/png');
      resultImg.src = dataUrl;
      if (stream) stream.getTracks().forEach(t => t.stop());
      resultBox.classList.remove('anim-flash');
      void resultBox.offsetWidth;
      resultBox.classList.add('anim-flash');
      showScene(sceneResult);
      setupShare(dataUrl);
    });
    $('retake-btn').addEventListener('click', () => { showScene(sceneLoading); startCamera(); });
    $('download-btn').addEventListener('click', () => {
      // Use Blob to preserve raw lossless PNG quality and avoid base64 data URL size caps in browsers
      fetch(resultImg.src)
        .then(res => res.blob())
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = 'citadel-photo-' + Date.now() + '.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
        });
    });
    function setupShare(dataUrl) {
      const btn = $('share-btn');
      if (navigator.share && navigator.canShare) {
        btn.classList.remove('hidden');
        btn.onclick = async () => {
          try {
            const blob = await (await fetch(dataUrl)).blob();
            const file = new File([blob], 'citadel-photo-' + Date.now() + '.png', {type:'image/png'});
            if (navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'My Citadel Photo', text:'Check out my photo from Citadel of Truth & Mercy!'});
          } catch(e) {}
        };
      } else { btn.classList.add('hidden'); }
    }
    init();
  </script>
</body>
</html>
